<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Dragon Isles</title>
  <meta name="description" content="Breed, raise and battle dragons. Free forever, no purchases.">
  <meta name="theme-color" content="#3aa0e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dragon Isles">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar"></header>
    <main id="view"></main>
    <nav id="tabs">
      <button data-act="tab" data-tab="island" class="on"><span>🏝️</span>Island</button>
      <button data-act="tab" data-tab="dragons"><span>🐉</span>Dragons</button>
      <button data-act="tab" data-tab="book"><span>📖</span>Book</button>
      <button data-act="tab" data-tab="battle"><span>⚔️</span>Battle</button>
      <button data-act="tab" data-tab="shop"><span>🛒</span>Shop</button>
    </nav>
  </div>
  <div id="sheets"></div>
  <div id="battle"></div>
  <div id="toasts"></div>
  <noscript>Dragon Isles needs JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
