<!doctype html>
<meta charset="utf-8">
<style>html, body { margin: 0 } #i { width: 512px; height: 512px; background: radial-gradient(circle at 50% 35%, #bfe9ff, #3aa0e8 70%); display: grid; place-items: center; overflow: hidden } #i svg { width: 500px; margin-top: 10px }</style>
<div id="i"></div>
<script type="module">
  // Dev page used to render the app icon: tools/icon.html?id=emberjaw
  import { DRAGONS } from '../docs/js/data.js';
  import { dragonSVG } from '../docs/js/art.js';
  const id = new URLSearchParams(location.search).get('id') || 'emberjaw';
  document.getElementById('i').innerHTML = dragonSVG(DRAGONS[id]);
</script>
